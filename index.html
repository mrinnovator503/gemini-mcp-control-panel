<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP // Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1c2c;
            --text-color: #dcd7ba;
            --primary-color: #ffaf5f;
            --border-color: #5a5a78;
            --card-color: rgba(42, 42, 60, 0.5);
            --glow-color: rgba(255, 175, 95, 0.1);
        }
        
        body {
            font-family: 'VT323', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        h1 {
            color: #fff;
            text-align: center;
            font-weight: 400;
            text-shadow: 0 0 5px var(--primary-color);
            margin-bottom: 0;
        }
        
        .card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 0; /* Sharp corners for retro feel */
            padding: 1.5rem;
            box-shadow: 0 0 15px var(--glow-color);
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-weight: 400;
            font-size: 1.5rem;
        }

        button {
            width: 100%;
            padding: 12px 24px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            letter-spacing: 1px;
            color: var(--bg-color);
            background-color: var(--primary-color);
            border: 1px solid var(--primary-color);
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        button:hover {
            background-color: var(--bg-color);
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            background-color: #2e2e48;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 0;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        #status-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--primary-color);
            color: var(--bg-color);
            padding: 10px 20px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s;
            pointer-events: none;
        }
        
        #status-notification.show {
            opacity: 1;
            transform: translate(-50%, -10px);
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>MCP // Control Panel</h1>
        
        <div class="card">
            <h2>Add Todoist Task</h2>
            <textarea id="taskInput" placeholder="> Enter task..." rows="3"></textarea>
            <button id="addTaskButton">Transmit</button>
        </div>
        
        <div class="card">
            <h2>Sync with Todoist</h2>
            <p>Manually sync local task file.</p>
            <button id="syncTasksButton">Execute Sync</button>
            <div id="taskWidgetDisplay" class="response-box" style="margin-top: 1rem;">Click 'Execute Sync' to display your tasks here.</div>
        </div>

        <div class="card">
            <h2>System Check</h2>
            <p>Verify connection to backend matrix.</p>
            <button id="testButton">Ping</button>
        </div>
    </div>

    <!-- Status Notification Area -->
    <div id="status-notification"></div>

    <script>
        const addTaskButton = document.getElementById('addTaskButton');
        const taskInput = document.getElementById('taskInput');
        const syncTasksButton = document.getElementById('syncTasksButton');
        const testButton = document.getElementById('testButton');
        const statusNotification = document.getElementById('status-notification');

        const backendBaseUrl = 'https://mcp-backend-pbxa.onrender.com';

        let statusTimeout;

        function showStatus(message, isError = false) {
            clearTimeout(statusTimeout);
            statusNotification.textContent = message;
            statusNotification.style.backgroundColor = isError ? '#ff5f5f' : 'var(--primary-color)';
            statusNotification.classList.add('show');
            statusTimeout = setTimeout(() => {
                statusNotification.classList.remove('show');
            }, 3000);
        }

        // --- Event Listeners ---

        testButton.addEventListener('click', async () => {
            showStatus('Pinging backend...');
            try {
                const res = await fetch(backendBaseUrl + '/ping');
                if (!res.ok) throw new Error(`Server responded with ${res.status}`);
                const data = await res.json();
                showStatus('✓ Ping successful!');
                console.log(data);
            } catch (error) {
                showStatus(`✗ Ping failed: ${error.message}`, true);
                console.error('Error:', error);
            }
        });

        addTaskButton.addEventListener('click', async () => {
            const taskContent = taskInput.value.trim();
            if (!taskContent) {
                showStatus('✗ Task content empty.', true);
                return;
            }

            showStatus('Transmitting task...');
            try {
                const res = await fetch(backendBaseUrl + '/add-task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskContent: taskContent }),
                });
                if (!res.ok) throw new Error(`Server responded with ${res.status}`);
                const data = await res.json();
                showStatus('✓ Task transmitted!');
                taskInput.value = ''; // Clear input on success
            } catch (error) {
                showStatus(`✗ Transmission failed: ${error.message}`, true);
                console.error('Error:', error);
            }
        });

        syncTasksButton.addEventListener('click', async () => {
            showStatus('Executing sync...');
            try {
                const res = await fetch(backendBaseUrl + '/sync-tasks', { method: 'POST' });
                if (!res.ok) throw new Error(`Server responded with ${res.status}`);
                const data = await res.json();
                taskWidgetDisplay.innerHTML = `<pre>${data.markdown}</pre>`;
                showStatus('✓ Sync complete!');
            } catch (error) {
                showStatus(`✗ Sync failed: ${error.message}`, true);
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
