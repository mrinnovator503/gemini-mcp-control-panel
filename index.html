<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Control Panel - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #0056b3;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #response {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #e9ecef;
            min-height: 50px;
            text-align: left;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MCP Control Panel</h1>
        <p>This is a test page for our Model Context Protocol frontend.</p>
        <button id="testButton">Test Connection to MCP Backend</button>
        <div id="response">
            Waiting for connection test...
        </div>

        <hr style="margin: 30px 0;">

        <h2>Add Todoist Task</h2>
        <textarea id="taskInput" placeholder="Enter your task here (e.g., Buy milk tomorrow at 5pm #groceries p1)" rows="3"></textarea>
        <button id="addTaskButton">Add Task to Todoist</button>
        <div id="taskResponse">
            Waiting for task submission...
        </div>
    </div>

    <script>
        const testButton = document.getElementById('testButton');
        const responseDiv = document.getElementById('response');
        
        const addTaskButton = document.getElementById('addTaskButton');
        const taskInput = document.getElementById('taskInput');
        const taskResponseDiv = document.getElementById('taskResponse');

        const backendBaseUrl = 'https://mcp-backend-pbxa.onrender.com'; // Base URL for the backend

        testButton.addEventListener('click', async () => {
            responseDiv.textContent = 'Connecting to backend...';
            try {
                const res = await fetch(backendBaseUrl + '/ping');
                const data = await res.json();
                responseDiv.textContent = `Response from backend: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                responseDiv.textContent = `Error connecting to backend: ${error.message}. 
                Please ensure your backend is running and the URL is correct.`;
                console.error('Error:', error);
            }
        });

        addTaskButton.addEventListener('click', async () => {
            const taskContent = taskInput.value.trim();
            if (!taskContent) {
                taskResponseDiv.textContent = 'Please enter a task.';
                return;
            }

            taskResponseDiv.textContent = 'Adding task...';
            try {
                const res = await fetch(backendBaseUrl + '/add-task', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ taskContent: taskContent }),
                });
                const data = await res.json();
                taskResponseDiv.textContent = `Response from backend: ${JSON.stringify(data, null, 2)}`;
                if (res.ok) {
                    taskInput.value = ''; // Clear input on success
                }
            } catch (error) {
                taskResponseDiv.textContent = `Error adding task: ${error.message}.`;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
